<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunSecurityBot Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --stellar-blue: #1736dd;
            --stellar-blue-hover: #142fc0;
            --stellar-text-on-primary: #e6e6e6;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #d4d4d8;
            background-image: radial-gradient(circle at 50% 0%, #1736dd15 0%, transparent 50%),
                              linear-gradient(to right, #ffffff05 1px, transparent 1px),
                              linear-gradient(to bottom, #ffffff05 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-attachment: fixed;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        .nav-item.active {
            background-color: #1736dd15;
            color: var(--stellar-text-on-primary);
            border-right: 2px solid var(--stellar-blue);
        }
        .nav-item.active iconify-icon { color: var(--stellar-blue); }
        .loader {
            border: 2px solid #27272a;
            border-bottom-color: var(--stellar-blue);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toast {
            position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 50;
            display: flex; flex-direction: column; gap: 0.5rem;
            pointer-events: none;
        }
        .toast-item {
            background: #18181b; border: 1px solid #3f3f46;
            padding: 0.625rem 0.875rem; border-radius: 0.375rem;
            font-size: 0.75rem; max-width: 360px; pointer-events: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .toast-item.error { border-color: #ef444450; background: #18181b; color: #fca5a5; }
        .toast-item.success { border-color: #22c55e50; color: #86efac; }
        .toast-item.info { border-color: #1736dd50; color: #93c5fd; }
        :focus-visible { outline: 2px solid var(--stellar-blue); outline-offset: 1px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-sm antialiased selection:bg-[#1736dd]/30 selection:text-white">

    <aside class="w-64 flex-shrink-0 flex flex-col border-r border-zinc-800/60 bg-zinc-950/80 backdrop-blur-md z-20">
        <div class="h-14 flex items-center px-4 border-b border-zinc-800/60">
            <div class="flex items-center gap-2 text-zinc-100 font-medium tracking-tight">
                <iconify-icon icon="solar:shield-check-linear" width="1.2em" height="1.2em" class="text-[#1736dd]"></iconify-icon>
                SunSecurityBot
            </div>
            <div class="ml-auto text-xs text-zinc-500 font-mono tracking-tight">v1.2</div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 flex flex-col gap-1" aria-label="Primary">
            <div class="px-4 text-xs font-mono text-zinc-600 mb-2 mt-2 uppercase tracking-tight">Console</div>
            <button type="button" data-view="dashboard" id="nav-dashboard" class="nav-item flex items-center gap-3 px-4 py-2 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50 transition-colors text-left w-full">
                <span class="text-xs font-mono text-zinc-600 w-4">01</span>
                <iconify-icon icon="solar:widget-2-linear" width="1.2em" height="1.2em"></iconify-icon>
                <span>Dashboard</span>
            </button>
            <button type="button" data-view="checks" id="nav-checks" class="nav-item flex items-center gap-3 px-4 py-2 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50 transition-colors text-left w-full">
                <span class="text-xs font-mono text-zinc-600 w-4">02</span>
                <iconify-icon icon="solar:history-linear" width="1.2em" height="1.2em"></iconify-icon>
                <span>Checks History</span>
            </button>
            <button type="button" data-view="manual" id="nav-manual" class="nav-item flex items-center gap-3 px-4 py-2 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50 transition-colors text-left w-full">
                <span class="text-xs font-mono text-zinc-600 w-4">03</span>
                <iconify-icon icon="solar:code-scan-linear" width="1.2em" height="1.2em"></iconify-icon>
                <span>Manual Analyze</span>
            </button>
            <button type="button" data-view="repos" id="nav-repos" class="nav-item flex items-center gap-3 px-4 py-2 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50 transition-colors text-left w-full">
                <span class="text-xs font-mono text-zinc-600 w-4">04</span>
                <iconify-icon icon="solar:folder-with-files-linear" width="1.2em" height="1.2em"></iconify-icon>
                <span>Repos</span>
            </button>
            <button type="button" data-view="settings" id="nav-settings" class="nav-item flex items-center gap-3 px-4 py-2 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50 transition-colors text-left w-full">
                <span class="text-xs font-mono text-zinc-600 w-4">05</span>
                <iconify-icon icon="solar:settings-linear" width="1.2em" height="1.2em"></iconify-icon>
                <span>Settings</span>
            </button>
            <button type="button" data-view="budget" id="nav-budget" class="nav-item flex items-center gap-3 px-4 py-2 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900/50 transition-colors text-left w-full">
                <span class="text-xs font-mono text-zinc-600 w-4">06</span>
                <iconify-icon icon="solar:wallet-linear" width="1.2em" height="1.2em"></iconify-icon>
                <span>Budget</span>
            </button>
        </nav>

        <div class="p-4 border-t border-zinc-800/60 text-xs flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span class="text-zinc-500">LLM Engine</span>
                <span id="footer-llm" class="flex items-center gap-1.5 text-zinc-300">
                    <span class="w-1.5 h-1.5 rounded-full bg-zinc-500"></span> ...
                </span>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-zinc-500">VCS</span>
                <span id="footer-vcs" class="flex items-center gap-1.5 text-zinc-300">
                    <span class="w-1.5 h-1.5 rounded-full bg-zinc-500"></span> ...
                </span>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-zinc-950">
        <header class="h-14 flex items-center justify-between px-6 border-b border-zinc-800/60 bg-zinc-950/80 backdrop-blur-md z-10 sticky top-0">
            <div class="flex items-center gap-4 flex-1">
                <div class="text-xs text-zinc-500" id="topbar-context" aria-live="polite">Loading...</div>
            </div>
            <div class="flex items-center gap-6 text-xs">
                <div class="flex items-center gap-2">
                    <span class="text-zinc-500">Budget Today:</span>
                    <span class="font-mono text-zinc-300" id="global-budget" aria-live="polite">— / — ₽</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 scroll-smooth" id="app-container" aria-live="polite" aria-busy="false">
            <div class="flex items-center justify-center h-full"><span class="loader w-6 h-6" role="status" aria-label="Loading"></span></div>
        </div>
    </main>

    <div class="toast" id="toast-host" role="region" aria-label="Notifications" aria-live="polite"></div>

    <script>
    'use strict';

    const API_BASE = '/api/console';

    async function apiFetch(path, opts) {
        opts = opts || {};
        const method = opts.method || 'GET';
        const body = opts.body;
        const timeoutMs = opts.timeoutMs || 30000;
        const allow404 = !!opts.allow404;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        const fetchOpts = { method: method, signal: ctrl.signal, headers: {} };
        if (body !== undefined) {
            fetchOpts.headers['Content-Type'] = 'application/json';
            fetchOpts.body = JSON.stringify(body);
        }
        let resp;
        try {
            resp = await fetch(API_BASE + path, fetchOpts);
        } catch (err) {
            clearTimeout(timer);
            if (err && err.name === 'AbortError') {
                const e = new Error('Request timed out');
                e.code = 'TIMEOUT'; e.path = path;
                throw e;
            }
            const e = new Error('Network error: ' + (err && err.message ? err.message : 'unknown'));
            e.code = 'NETWORK'; e.path = path;
            throw e;
        }
        clearTimeout(timer);
        if (resp.status === 204) return null;
        if (allow404 && resp.status === 404) return null;
        const ct = resp.headers.get('content-type') || '';
        let payload = null;
        if (ct.indexOf('application/json') !== -1) {
            try { payload = await resp.json(); } catch (_) { payload = null; }
        } else {
            try { payload = await resp.text(); } catch (_) { payload = null; }
        }
        if (!resp.ok) {
            let detail;
            if (payload && typeof payload === 'object' && payload.detail) {
                detail = typeof payload.detail === 'string' ? payload.detail : JSON.stringify(payload.detail);
            } else if (typeof payload === 'string' && payload) {
                detail = payload;
            } else {
                detail = 'HTTP ' + resp.status;
            }
            const e = new Error(detail);
            e.code = 'HTTP_' + resp.status;
            e.status = resp.status;
            e.payload = payload;
            throw e;
        }
        return payload;
    }

    const API = {
        getBudget()    { return apiFetch('/budget'); },
        getSettings()  { return apiFetch('/settings'); },
        getDashboard() { return apiFetch('/dashboard').catch(() => null); },
        getChecks(filters) {
            const qs = new URLSearchParams();
            if (filters) {
                if (filters.status) qs.set('status', filters.status);
                if (filters.repo) qs.set('repo', filters.repo);
                if (filters.limit !== undefined) qs.set('limit', String(filters.limit));
                if (filters.offset !== undefined) qs.set('offset', String(filters.offset));
            }
            const tail = qs.toString();
            return apiFetch('/checks' + (tail ? '?' + tail : ''));
        },
        getCheckById(id) { return apiFetch('/checks/' + encodeURIComponent(id), { allow404: true }); },
        getRepos()       { return apiFetch('/repos'); },
        createRepo(data) { return apiFetch('/repos', { method: 'POST', body: data, timeoutMs: 15000 }); },
        updateRepo(id, d){ return apiFetch('/repos/' + encodeURIComponent(id), { method: 'PATCH', body: d, timeoutMs: 15000 }); },
        deleteRepo(id)   { return apiFetch('/repos/' + encodeURIComponent(id), { method: 'DELETE' }); },
        getTunnel()      { return apiFetch('/tunnel'); },
        installWebhook(id, body) {
            return apiFetch('/repos/' + encodeURIComponent(id) + '/webhook',
                { method: 'POST', body: body || {}, timeoutMs: 20000 });
        },
        removeWebhook(id) {
            return apiFetch('/repos/' + encodeURIComponent(id) + '/webhook',
                { method: 'DELETE', timeoutMs: 20000 });
        },
        analyzeManual(p) { return apiFetch('/manual/analyze', { method: 'POST', body: p, timeoutMs: 90000 }); }
    };

    function toast(message, kind, durationMs) {
        kind = kind || 'info';
        durationMs = durationMs || 4500;
        const host = document.getElementById('toast-host');
        if (!host) return;
        const item = document.createElement('div');
        item.className = 'toast-item ' + (kind === 'error' ? 'error' : kind === 'success' ? 'success' : 'info');
        item.setAttribute('role', kind === 'error' ? 'alert' : 'status');
        item.textContent = message;
        host.appendChild(item);
        setTimeout(() => { item.remove(); }, durationMs);
    }

    function el(tag, attrs, children) {
        const node = document.createElement(tag);
        if (attrs) {
            for (const k in attrs) {
                if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
                const v = attrs[k];
                if (v === null || v === undefined) continue;
                if (k === 'class') node.className = v;
                else if (k === 'text') node.textContent = v;
                else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2), v);
                else node.setAttribute(k, String(v));
            }
        }
        if (children) {
            for (let i = 0; i < children.length; i++) {
                const ch = children[i];
                if (ch === null || ch === undefined || ch === false) continue;
                if (typeof ch === 'string' || typeof ch === 'number') node.appendChild(document.createTextNode(String(ch)));
                else node.appendChild(ch);
            }
        }
        return node;
    }

    function icon(name) {
        const i = document.createElement('iconify-icon');
        i.setAttribute('icon', name);
        i.setAttribute('width', '1.2em');
        i.setAttribute('height', '1.2em');
        return i;
    }

    function fmtDate(ds) {
        if (!ds) return '—';
        try {
            return new Date(ds).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        } catch (_) { return String(ds); }
    }
    function fmtDuration(ms) {
        if (ms === null || ms === undefined) return '—';
        if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
        return ms + 'ms';
    }
    function fmtRub(n) {
        if (n === null || n === undefined || isNaN(n)) return '— ₽';
        return Number(n).toFixed(2) + ' ₽';
    }

    function statusBadge(status) {
        const styles = {
            completed: 'bg-green-500/10 text-green-400 border-green-500/20',
            failed:    'bg-red-500/10 text-red-400 border-red-500/20',
            skipped:   'bg-zinc-500/10 text-zinc-400 border-zinc-500/20',
            running:   'bg-blue-500/10 text-blue-400 border-blue-500/20'
        };
        const cls = styles[status] || styles.skipped;
        return el('span', { class: 'px-2 py-0.5 rounded text-[10px] uppercase tracking-wider border ' + cls, text: status || 'unknown' });
    }
    function severityBadge(sev) {
        const styles = {
            critical: 'bg-red-500/10 text-red-400 border-red-500/20',
            high:     'bg-orange-500/10 text-orange-400 border-orange-500/20',
            medium:   'bg-amber-500/10 text-amber-400 border-amber-500/20',
            low:      'bg-green-500/10 text-green-400 border-green-500/20',
            info:     'bg-blue-500/10 text-blue-400 border-blue-500/20'
        };
        const cls = styles[sev] || styles.info;
        return el('span', { class: 'px-2 py-0.5 rounded text-[10px] uppercase tracking-wider border ' + cls, text: sev || 'info' });
    }

    function emptyState(title, hint) {
        return el('div', { class: 'flex flex-col items-center justify-center text-center py-16 text-zinc-500 gap-2' }, [
            el('div', { class: 'text-base text-zinc-400', text: title }),
            hint ? el('div', { class: 'text-xs', text: hint }) : null
        ]);
    }

    function errorPanel(message) {
        return el('div', { class: 'p-4 bg-red-500/10 text-red-400 border border-red-500/20 rounded-md text-sm', text: 'Error: ' + message });
    }

    function loadingBlock() {
        return el('div', { class: 'flex items-center justify-center py-16' }, [
            el('span', { class: 'loader w-6 h-6', role: 'status', 'aria-label': 'Loading' })
        ]);
    }

    const app = {
        state: { currentView: null, activeCheckId: null },

        async init() {
            this.bindNav();
            await this.refreshHeader();
            this.navigate('dashboard');
        },

        bindNav() {
            const btns = document.querySelectorAll('.nav-item[data-view]');
            const self = this;
            btns.forEach((b) => b.addEventListener('click', () => self.navigate(b.getAttribute('data-view'))));
        },

        async refreshHeader() {
            try {
                const b = await API.getBudget();
                const txt = (b && typeof b.spentRub === 'number')
                    ? (b.spentRub.toFixed(2) + ' / ' + b.limitRub.toFixed(2) + ' ₽')
                    : '— / — ₽';
                document.getElementById('global-budget').textContent = txt;
            } catch (_) {
                document.getElementById('global-budget').textContent = '— / — ₽';
            }
            try {
                const s = await API.getSettings();
                const llmEl = document.getElementById('footer-llm');
                const vcsEl = document.getElementById('footer-vcs');
                llmEl.replaceChildren(
                    el('span', { class: 'w-1.5 h-1.5 rounded-full bg-green-500' }),
                    document.createTextNode(' ' + (s && s.model ? s.model : 'unknown'))
                );
                vcsEl.replaceChildren(
                    el('span', { class: 'w-1.5 h-1.5 rounded-full bg-green-500' }),
                    document.createTextNode(' ' + (s && s.vcsProvider ? s.vcsProvider : 'unknown'))
                );
                document.getElementById('topbar-context').textContent =
                    'env=' + (s.appEnv || '?') + '  provider=' + (s.llmProvider || '?');
            } catch (_) { /* keep defaults */ }
        },

        navigate(view, params) {
            params = params || {};
            this.state.currentView = view;
            document.querySelectorAll('.nav-item').forEach((e) => e.classList.remove('active'));
            const navId = view === 'check-details' ? 'nav-checks' : 'nav-' + view;
            const navBtn = document.getElementById(navId);
            if (navBtn) navBtn.classList.add('active');

            const container = document.getElementById('app-container');
            container.setAttribute('aria-busy', 'true');
            container.replaceChildren(loadingBlock());

            (async () => {
                try {
                    let node;
                    if (view === 'dashboard') node = await renderDashboard();
                    else if (view === 'checks') node = await renderChecks();
                    else if (view === 'check-details') node = await renderCheckDetails(params.id);
                    else if (view === 'settings') node = await renderSettings();
                    else if (view === 'budget') node = await renderBudget();
                    else if (view === 'manual') node = await renderManualAnalyze();
                    else if (view === 'repos') node = await renderRepos();
                    else node = errorPanel('View not found: ' + view);
                    container.replaceChildren(node);
                } catch (e) {
                    container.replaceChildren(errorPanel(e && e.message ? e.message : String(e)));
                    toast('Failed to load view: ' + (e && e.message ? e.message : 'unknown'), 'error');
                } finally {
                    container.setAttribute('aria-busy', 'false');
                }
            })();
        }
    };

    async function renderDashboard() {
        let dashboard = null;
        let budget = null;
        let checks = [];
        try { dashboard = await API.getDashboard(); } catch (_) { dashboard = null; }
        try { budget = await API.getBudget(); } catch (_) { budget = null; }
        if (dashboard && Array.isArray(dashboard.recentChecks)) {
            checks = dashboard.recentChecks;
        } else {
            try { checks = (await API.getChecks({ limit: 5 })) || []; } catch (_) { checks = []; }
        }

        const todayChecks = checks.length;
        const successChecks = checks.filter((c) => c.status === 'completed').length;
        const successRate = todayChecks > 0 ? Math.round((successChecks / todayChecks) * 100) : 0;
        const highSev = checks.reduce((acc, c) => {
            const s = c.severityCounts || {};
            return acc + (s.critical || 0) + (s.high || 0);
        }, 0);

        const wrap = el('div', { class: 'max-w-6xl mx-auto space-y-6' });
        wrap.appendChild(el('div', { class: 'flex items-end justify-between' }, [
            el('div', null, [
                el('h1', { class: 'text-xl font-medium tracking-tight text-zinc-100', text: 'Overview' }),
                el('p', { class: 'text-xs text-zinc-500 mt-1', text: 'System status and recent activity' })
            ])
        ]));

        const metricsRow = el('div', { class: 'grid grid-cols-1 md:grid-cols-4 gap-4' });
        function card(label, value, valueClass) {
            return el('div', { class: 'bg-zinc-900/50 border border-zinc-800/60 rounded-md p-4 flex flex-col gap-1' }, [
                el('span', { class: 'text-xs text-zinc-500 tracking-tight', text: label }),
                el('span', { class: 'text-2xl font-medium ' + (valueClass || 'text-zinc-100'), text: value })
            ]);
        }
        metricsRow.appendChild(card('Recent Checks', String(todayChecks)));
        metricsRow.appendChild(card('Success Rate', successRate + '%'));
        metricsRow.appendChild(card('Crit/High Findings', String(highSev), highSev > 0 ? 'text-red-400' : 'text-zinc-100'));
        const budgetCard = el('div', { class: 'bg-zinc-900/50 border border-zinc-800/60 rounded-md p-4 flex flex-col gap-1' }, [
            el('span', { class: 'text-xs text-zinc-500 tracking-tight', text: 'Budget Remaining' }),
            el('span', { class: 'text-2xl font-medium text-zinc-100', text: budget ? fmtRub(budget.remainingRub) : '— ₽' })
        ]);
        const bar = el('div', { class: 'w-full bg-zinc-800 h-1 mt-2 rounded-full overflow-hidden' });
        const fill = el('div', { class: 'bg-[#1736dd] h-full' });
        const pct = budget && typeof budget.limitPercent === 'number' ? Math.min(100, Math.max(0, budget.limitPercent)) : 0;
        fill.style.width = pct + '%';
        bar.appendChild(fill);
        budgetCard.appendChild(bar);
        metricsRow.appendChild(budgetCard);
        wrap.appendChild(metricsRow);

        const tableCard = el('div', { class: 'bg-zinc-900/50 border border-zinc-800/60 rounded-md' });
        tableCard.appendChild(el('div', { class: 'px-4 py-3 border-b border-zinc-800/60 flex justify-between items-center bg-zinc-900/80 rounded-t-md' }, [
            el('h2', { class: 'text-sm font-medium text-zinc-200 tracking-tight', text: 'Recent Activity' }),
            el('button', {
                type: 'button',
                class: 'text-xs text-[#1736dd] hover:text-[#142fc0]',
                text: 'View all',
                onclick: () => app.navigate('checks')
            })
        ]));

        if (checks.length === 0) {
            tableCard.appendChild(emptyState('No checks yet', 'Register a repo in the Repos view and trigger a webhook.'));
        } else {
            const table = el('table', { class: 'w-full text-left text-xs whitespace-nowrap' });
            const thead = el('thead', null, [
                el('tr', { class: 'text-zinc-500 border-b border-zinc-800/60' }, [
                    el('th', { class: 'px-4 py-2 font-normal', text: 'Repo / PR' }),
                    el('th', { class: 'px-4 py-2 font-normal', text: 'Status' }),
                    el('th', { class: 'px-4 py-2 font-normal', text: 'Findings' }),
                    el('th', { class: 'px-4 py-2 font-normal', text: 'Time' })
                ])
            ]);
            const tbody = el('tbody', { class: 'divide-y divide-zinc-800/60' });
            checks.slice(0, 5).forEach((c) => {
                const row = el('tr', { class: 'hover:bg-zinc-800/20 transition-colors cursor-pointer', tabindex: '0' });
                row.addEventListener('click', () => app.navigate('check-details', { id: c.id }));
                row.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') app.navigate('check-details', { id: c.id }); });
                row.appendChild(el('td', { class: 'px-4 py-3' }, [

        grid.appendChild(inputCol);

        const resultsCol = el('div', { class: 'flex flex-col border border-zinc-800/60 rounded-md bg-zinc-900/30 overflow-hidden' });
        resultsCol.appendChild(el('div', { class: 'px-4 py-2 bg-zinc-900 border-b border-zinc-800/60 text-xs font-mono text-zinc-400', text: 'Analysis Results' }));
        const resultsHost = el('div', { id: 'manual-results', class: 'flex-1 p-4 overflow-y-auto text-zinc-600 text-sm' });
        resultsHost.appendChild(el('div', { class: 'flex items-center justify-center h-full text-zinc-600', text: 'Run analysis to see results' }));
        resultsCol.appendChild(resultsHost);
        grid.appendChild(resultsCol);

        wrap.appendChild(grid);

        analyzeBtn.addEventListener('click', async () => {
            analyzeBtn.disabled = true;
            const previousChildren = Array.prototype.slice.call(analyzeBtn.childNodes);
            analyzeBtn.replaceChildren(
                el('span', { class: 'loader w-4 h-4', role: 'status', 'aria-label': 'Analyzing' }),
                document.createTextNode(' Analyzing...')
            );
            resultsHost.replaceChildren(
                el('div', { class: 'flex flex-col items-center gap-2 text-zinc-500 justify-center h-full' }, [
                    el('span', { class: 'loader w-6 h-6' }),
                    document.createTextNode('Running analysis pipeline...')
                ])
            );
            try {
                const payload = { files: [{ path: pathInput.value || 'snippet.txt', code: codeArea.value || '', language: langSel.value || 'python' }] };
                const res = await API.analyzeManual(payload);
                renderManualResults(resultsHost, res);
            } catch (e) {
                resultsHost.replaceChildren(errorPanel(e.message || 'Analysis failed'));
                toast('Analyze failed: ' + (e.message || 'unknown'), 'error');
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.replaceChildren.apply(analyzeBtn, previousChildren);
            }
        });
        return wrap;
    }

    function renderManualResults(host, res) {
        host.replaceChildren();
        host.classList.remove('text-zinc-600');
        const wrap = el('div', { class: 'w-full space-y-4' });
        wrap.appendChild(el('div', { class: 'bg-[#1736dd]/10 border border-[#1736dd]/20 p-3 rounded text-sm text-blue-200 flex items-start gap-2' }, [
            icon('solar:info-circle-linear'),
            el('span', { class: 'whitespace-pre-wrap', text: res.summary || '—' })
        ]));
        const findings = Array.isArray(res.findings) ? res.findings : [];
        if (findings.length === 0) {
            wrap.appendChild(el('div', { class: 'text-zinc-500 text-xs', text: 'No findings reported.' }));
        } else {
            findings.forEach((f) => {
                const card = el('div', { class: 'border border-orange-500/20 bg-orange-500/5 rounded p-4 space-y-2' });
                card.appendChild(el('div', { class: 'flex justify-between items-start' }, [
                    severityBadge(f.severity),
                    el('span', { class: 'text-[10px] font-mono text-zinc-500', text: f.class || '' })
                ]));
                card.appendChild(el('div', { class: 'text-sm text-zinc-200 whitespace-pre-wrap', text: f.message || '' }));
                card.appendChild(el('div', { class: 'text-xs text-zinc-500 font-mono', text: 'File: ' + (f.file || '—') + ':' + (f.line || 0) }));
                if (f.suggestion) {
                    card.appendChild(el('div', { class: 'text-xs text-blue-200/80 whitespace-pre-wrap', text: 'Suggestion: ' + f.suggestion }));
                }
                if (f.codeContext) {
                    const pre = el('pre', { class: 'mt-2 p-3 bg-[#0d0d0f] text-zinc-300 text-xs font-mono rounded overflow-x-auto' });
                    const code = el('code'); code.textContent = f.codeContext;
                    pre.appendChild(code);
                    card.appendChild(pre);
                }
                wrap.appendChild(card);
            });
        }
        const meta = res.llm || {};
        const cost = (meta.costRub !== undefined && meta.costRub !== null) ? fmtRub(meta.costRub) : '—';
        const latency = (meta.latencyMs !== undefined && meta.latencyMs !== null) ? meta.latencyMs + 'ms' : '—';
        wrap.appendChild(el('div', { class: 'text-[10px] text-zinc-600 font-mono pt-4 border-t border-zinc-800/60 mt-4' }, [
            document.createTextNode(
                'Status: ' + (meta.status || '?') +
                ' | Model: ' + (meta.model || '?') +
                ' | Latency: ' + latency +
                ' | Cost: ' + cost
            )
        ]));
        host.appendChild(wrap);
    }

    async function renderRepos() {
        const wrap = el('div', { class: 'max-w-6xl mx-auto space-y-6' });
        const addBtn = el('button', {
            type: 'button', id: 'btn-add-repo',
            class: 'bg-[#1736dd] hover:bg-[#142fc0] text-white px-3 py-1.5 rounded text-sm flex items-center gap-2'
        }, [icon('solar:add-circle-linear'), document.createTextNode(' Add Repository')]);

        wrap.appendChild(el('div', { class: 'flex items-center justify-between' }, [
            el('div', null, [
                el('h1', { class: 'text-xl font-medium tracking-tight text-zinc-100', text: 'Repos & Onboarding' }),
                el('p', { class: 'text-xs text-zinc-500 mt-1', text: 'Register repositories the bot should monitor. Tokens are stored as env-references; the DB never contains plaintext secrets.' })
            ]),
            addBtn
        ]));

        // Tunnel status widget — shows the public URL the bot will use as
        // GitHub webhook target (auto-detected from ngrok or PUBLIC_BASE_URL).
        const tunnelHost = el('div', {
            id: 'tunnel-status-host',
            class: 'bg-zinc-900/40 border border-zinc-800/60 rounded-md p-4 text-xs'
        });
        wrap.appendChild(tunnelHost);
        let tunnelState = { running: false, publicUrl: null, source: null };

        async function refreshTunnel() {
            tunnelHost.replaceChildren(el('span', { class: 'text-zinc-500', text: 'Detecting public tunnel…' }));
            try {
                const t = await API.getTunnel();
                tunnelState = {
                    running: !!t.running,
                    publicUrl: t.publicUrl || null,
                    source: t.source || null,
                };
            } catch (e) {
                tunnelState = { running: false, publicUrl: null, source: null };
            }
            renderTunnel();
        }

        function renderTunnel() {
            tunnelHost.replaceChildren();
            const left = el('div', { class: 'flex items-center gap-3 min-w-0' });
            if (tunnelState.running && tunnelState.publicUrl) {
                left.appendChild(el('span', { class: 'inline-block w-2 h-2 rounded-full bg-green-400' }));
                left.appendChild(el('span', { class: 'text-zinc-400', text: 'Public tunnel:' }));
                left.appendChild(el('span', { class: 'font-mono text-zinc-200 truncate', text: tunnelState.publicUrl }));
                left.appendChild(el('span', { class: 'text-[10px] text-zinc-500 uppercase tracking-wide', text: tunnelState.source || '' }));
            } else {
                left.appendChild(el('span', { class: 'inline-block w-2 h-2 rounded-full bg-amber-400' }));
                left.appendChild(el('span', { class: 'text-zinc-300', text: 'No public tunnel detected.' }));
                left.appendChild(el('span', { class: 'text-zinc-500', text: 'Run `ngrok http 8000` or set PUBLIC_BASE_URL in .env.' }));
            }
            const refreshBtn = el('button', {
                type: 'button',
                class: 'text-xs text-[#6e9bff] hover:text-[#a5beff]',
                text: 'Refresh'
            });
            refreshBtn.addEventListener('click', () => { void refreshTunnel(); });
            tunnelHost.appendChild(el('div', { class: 'flex items-center justify-between gap-4' }, [left, refreshBtn]));
        }

        const formHost = el('div', { id: 'repo-form-host' });
        wrap.appendChild(formHost);

        const tableHost = el('div', { class: 'bg-zinc-900/50 border border-zinc-800/60 rounded-md overflow-hidden' });
        wrap.appendChild(tableHost);

        async function reload() {
            tableHost.replaceChildren(loadingBlock());
            try {
                const repos = await API.getRepos();
                if (!repos || repos.length === 0) {
                    tableHost.replaceChildren(emptyState('No repositories registered yet', 'Click "Add Repository" to onboard one.'));
                    return;
                }
                const table = el('table', { class: 'w-full text-left text-xs whitespace-nowrap' });
                table.appendChild(el('thead', null, [
                    el('tr', { class: 'text-zinc-500 border-b border-zinc-800/60 bg-zinc-900/80' }, [
                        el('th', { class: 'px-4 py-2 font-normal', text: 'Full Name' }),
                        el('th', { class: 'px-4 py-2 font-normal', text: 'Provider' }),
                        el('th', { class: 'px-4 py-2 font-normal', text: 'Enabled' }),
                        el('th', { class: 'px-4 py-2 font-normal', text: 'Token' }),
                        el('th', { class: 'px-4 py-2 font-normal', text: 'Webhook Secret' }),
                        el('th', { class: 'px-4 py-2 font-normal', text: 'Webhook' }),
                        el('th', { class: 'px-4 py-2 font-normal', text: 'LLM Override' }),
                        el('th', { class: 'px-4 py-2 font-normal', text: 'Last Seen' }),
                        el('th', { class: 'px-4 py-2 font-normal text-right', text: 'Actions' })
                    ])
                ]));
                const tbody = el('tbody', { class: 'divide-y divide-zinc-800/60' });
                repos.forEach((r) => {
                    const tokenChip = r.vcsTokenSet
                        ? el('span', { class: 'text-green-400 text-[10px]', text: 'set' })
                        : el('span', { class: 'text-amber-400 text-[10px]', text: 'missing — re-input' });
                    const secretChip = r.webhookSecretSet
                        ? el('span', { class: 'text-green-400 text-[10px]', text: 'set' })
                        : el('span', { class: 'text-amber-400 text-[10px]', text: 'missing — re-input' });
                    const enabledChip = el('span', {
                        class: r.enabled ? 'text-green-400 text-[10px]' : 'text-zinc-500 text-[10px]',
                        text: r.enabled ? 'enabled' : 'disabled'
                    });

                    // Webhook chip — installed/reinstall/none.
                    const installed = !!r.webhookId;
                    const expectedUrl = tunnelState.publicUrl
                        ? (tunnelState.publicUrl + '/webhook/github')
                        : null;
                    const stale = installed && expectedUrl && r.webhookUrl && r.webhookUrl !== expectedUrl;
                    let whChip;
                    if (!installed) {
                        whChip = el('span', { class: 'text-zinc-500 text-[10px]', text: 'not installed' });
                    } else if (stale) {
                        whChip = el('span', { class: 'text-amber-400 text-[10px] font-mono', text: 'stale — reinstall' });
                    } else {
                        whChip = el('span', { class: 'text-green-400 text-[10px] font-mono truncate inline-block max-w-[180px]', text: 'id=' + r.webhookId });
                    }

                    const editBtn = el('button', { type: 'button', class: 'text-xs text-[#1736dd] hover:text-[#142fc0]', text: 'Edit' });
                    editBtn.addEventListener('click', () => openRepoForm(r));

                    const toggleBtn = el('button', {
                        type: 'button',
                        class: 'text-xs ' + (r.enabled ? 'text-amber-400 hover:text-amber-300' : 'text-green-400 hover:text-green-300'),
                        text: r.enabled ? 'Disable' : 'Enable'
                    });
                    toggleBtn.addEventListener('click', async () => {
                        try {
                            await API.updateRepo(r.id, { enabled: !r.enabled });
                            toast('Repo ' + (r.enabled ? 'disabled' : 'enabled'), 'success');
                            await reload();
                        } catch (e) { toast(e.message || 'Update failed', 'error'); }
                    });

                    // Install / Reinstall / Remove webhook buttons.
                    const installLabel = installed ? (stale ? 'Reinstall Webhook' : 'Reinstall Webhook') : 'Install Webhook';
                    const installBtn = el('button', {
                        type: 'button',
                        class: 'text-xs ' + (installed && !stale ? 'text-zinc-400 hover:text-zinc-200' : 'text-green-400 hover:text-green-300'),
                        text: installLabel
                    });
                    installBtn.addEventListener('click', async () => {
                        if (!tunnelState.running || !tunnelState.publicUrl) {
                            toast('No public tunnel detected. Start ngrok (`ngrok http 8000`) or set PUBLIC_BASE_URL.', 'error', 8000);
                            return;
                        }
                        if (!r.vcsTokenSet || !r.webhookSecretSet) {
                            toast('Token and Webhook Secret must be set first (Edit the repo).', 'error', 7000);
                            return;
                        }
                        installBtn.disabled = true;
                        installBtn.textContent = 'Installing…';
                        try {
                            const resp = await API.installWebhook(r.id, {});
                            toast('Webhook installed (id=' + resp.webhookId + ')', 'success');
                            await reload();
                        } catch (e) {
                            toast(e.message || 'Install failed', 'error', 8000);
                            installBtn.disabled = false;
                            installBtn.textContent = installLabel;
                        }
                    });

                    const removeWhBtn = installed ? el('button', {
                        type: 'button', class: 'text-xs text-amber-400 hover:text-amber-300', text: 'Remove Webhook'
                    }) : null;
                    if (removeWhBtn) {
                        removeWhBtn.addEventListener('click', async () => {
                            if (!confirm('Remove GitHub webhook for ' + r.fullName + '? The bot will no longer receive PR events from this repo.')) return;
                            try {
                                await API.removeWebhook(r.id);
                                toast('Webhook removed', 'success');
                                await reload();
                            } catch (e) { toast(e.message || 'Remove failed', 'error', 7000); }
                        });
                    }

                    const deleteBtn = el('button', { type: 'button', class: 'text-xs text-red-400 hover:text-red-300', text: 'Delete' });
                    deleteBtn.addEventListener('click', async () => {
                        if (!confirm('Delete repo ' + r.fullName + '? Webhook handling will fall back to global .env credentials.')) return;
                        try {
                            await API.deleteRepo(r.id);
                            toast('Repo deleted', 'success');
                            await reload();
                        } catch (e) { toast(e.message || 'Delete failed', 'error'); }
                    });

                    const actionsChildren = [editBtn, toggleBtn, installBtn];
                    if (removeWhBtn) actionsChildren.push(removeWhBtn);
                    actionsChildren.push(deleteBtn);

                    const row = el('tr', { class: 'hover:bg-zinc-800/20 transition-colors' });
                    row.appendChild(el('td', { class: 'px-4 py-3 font-mono text-zinc-200', text: r.fullName || '—' }));
                    row.appendChild(el('td', { class: 'px-4 py-3 text-zinc-400', text: r.vcsProvider || '—' }));
                    row.appendChild(el('td', { class: 'px-4 py-3' }, [enabledChip]));
                    row.appendChild(el('td', { class: 'px-4 py-3' }, [tokenChip]));
                    row.appendChild(el('td', { class: 'px-4 py-3' }, [secretChip]));
                    row.appendChild(el('td', { class: 'px-4 py-3' }, [whChip]));
                    row.appendChild(el('td', { class: 'px-4 py-3 text-zinc-400', text: r.llmProviderOverride || '—' }));
                    row.appendChild(el('td', { class: 'px-4 py-3 text-zinc-500', text: r.lastSeenAt ? fmtDate(r.lastSeenAt) : 'never' }));
                    row.appendChild(el('td', { class: 'px-4 py-3 text-right' }, [
                        el('div', { class: 'flex gap-3 justify-end flex-wrap' }, actionsChildren)
                    ]));
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);
                tableHost.replaceChildren(table);
            } catch (err) {
                tableHost.replaceChildren(errorPanel(err.message || 'Failed to load repos'));
            }
        }

        function openRepoForm(existing) {
            formHost.replaceChildren(buildRepoForm(existing, reload, () => formHost.replaceChildren()));
            formHost.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        addBtn.addEventListener('click', () => openRepoForm(null));
        await Promise.all([refreshTunnel(), reload()]);
        return wrap;
    }

    function buildRepoForm(existing, onSaved, onCancel) {
        const isEdit = !!existing;
        const form = el('form', {
            class: 'bg-zinc-900/50 border border-zinc-800/60 rounded-md p-5 space-y-4',
            'aria-label': isEdit ? 'Edit repository' : 'Add repository'
        });
        form.appendChild(el('div', { class: 'flex items-center justify-between' }, [
            el('h2', { class: 'text-sm font-medium text-zinc-200', text: isEdit ? ('Edit ' + existing.fullName) : 'Add Repository' }),
            el('button', { type: 'button', class: 'text-xs text-zinc-500 hover:text-zinc-300', text: 'Cancel', onclick: onCancel })
        ]));

        const errorBox = el('div', { class: 'hidden bg-red-500/10 text-red-400 border border-red-500/20 rounded-md p-3 text-xs', role: 'alert' });
        form.appendChild(errorBox);

        const grid = el('div', { class: 'grid grid-cols-1 md:grid-cols-2 gap-4' });

        function fieldBlock(label, input, hint) {
            const blk = el('div', { class: 'flex flex-col gap-1' });
            blk.appendChild(el('label', { class: 'text-[10px] uppercase tracking-wider text-zinc-500', for: input.id, text: label }));
            blk.appendChild(input);
            if (hint) blk.appendChild(el('span', { class: 'text-[10px] text-zinc-500', text: hint }));
            return blk;
        }

        const fullNameInput = el('input', {
            type: 'text', id: 'repo-full-name',
            placeholder: 'owner/repo',
            class: 'bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-xs text-zinc-200 font-mono focus:outline-none focus:border-zinc-600',
            value: existing ? existing.fullName : ''
        });
        if (isEdit) fullNameInput.readOnly = true;
        grid.appendChild(fieldBlock('Repository Full Name', fullNameInput, 'Format: owner/repo (e.g. stellar/core-api).'));

        const providerSel = el('select', {
            id: 'repo-provider',
            class: 'bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-600'
        });
        ['github'].forEach((v) => { const o = document.createElement('option'); o.value = v; o.textContent = v; providerSel.appendChild(o); });
        if (existing && existing.vcsProvider) providerSel.value = existing.vcsProvider;
        grid.appendChild(fieldBlock('VCS Provider', providerSel, 'Only "github" is supported in the MVP.'));

        const tokenInput = el('input', {
            type: 'password', id: 'repo-token', autocomplete: 'off',
            placeholder: isEdit ? 'leave blank to keep current' : 'ghp_...',
            class: 'bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-xs text-zinc-200 font-mono focus:outline-none focus:border-zinc-600'
        });
        grid.appendChild(fieldBlock('VCS Token', tokenInput, 'GitHub PAT with "repo" scope. Write-only; never returned by the API.'));

        const secretInput = el('input', {
            type: 'password', id: 'repo-secret', autocomplete: 'off',
            placeholder: isEdit ? 'leave blank to keep current' : 'webhook hmac secret',
            class: 'bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-xs text-zinc-200 font-mono focus:outline-none focus:border-zinc-600'
        });
        grid.appendChild(fieldBlock('Webhook Secret', secretInput, 'HMAC secret used to verify GitHub webhook signatures.'));

        const llmSel = el('select', {
            id: 'repo-llm',
            class: 'bg-zinc-900 border border-zinc-800 rounded px-2 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-600'
        });
        ['', 'polza', 'openrouter'].forEach((v) => {
            const o = document.createElement('option');
            o.value = v;
            o.textContent = v ? v : '(use global default)';
            llmSel.appendChild(o);
        });
        if (existing && existing.llmProviderOverride) llmSel.value = existing.llmProviderOverride;
        grid.appendChild(fieldBlock('LLM Provider Override', llmSel, 'Optional per-repo override.'));

        const enabledWrap = el('div', { class: 'flex items-center gap-2 pt-6' });
        const enabledChk = el('input', { type: 'checkbox', id: 'repo-enabled' });
        enabledChk.checked = existing ? !!existing.enabled : true;
        const enabledLabel = el('label', { for: 'repo-enabled', class: 'text-xs text-zinc-300', text: 'Enabled (bot monitors webhooks for this repo)' });
        enabledWrap.append(enabledChk, enabledLabel);
        grid.appendChild(enabledWrap);

        form.appendChild(grid);

        const submitBtn = el('button', {
            type: 'submit',
            class: 'bg-[#1736dd] hover:bg-[#142fc0] disabled:bg-zinc-700 text-white px-4 py-1.5 rounded text-sm',
            text: isEdit ? 'Save Changes' : 'Register Repository'
        });
        form.appendChild(el('div', { class: 'flex justify-end gap-3' }, [
            el('button', { type: 'button', class: 'text-xs text-zinc-400 hover:text-zinc-200', text: 'Cancel', onclick: onCancel }),
            submitBtn
        ]));

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.remove('hidden');
        }
        function clearError() {
            errorBox.textContent = '';
            errorBox.classList.add('hidden');
        }

        form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            clearError();
            const fullName = fullNameInput.value.trim();
            if (!isEdit) {
                const parts = fullName.split('/');
                if (!fullName || parts.length !== 2 || !parts[0] || !parts[1]) {
                    showError('Full name must be in form owner/repo.');
                    return;
                }
            }
            submitBtn.disabled = true;
            const prevText = submitBtn.textContent;
            submitBtn.textContent = isEdit ? 'Saving...' : 'Registering...';
            try {
                if (isEdit) {
                    const patch = {
                        vcsProvider: providerSel.value,
                        enabled: enabledChk.checked,
                        llmProviderOverride: llmSel.value || null
                    };
                    if (tokenInput.value) patch.vcsToken = tokenInput.value;
                    if (secretInput.value) patch.webhookSecret = secretInput.value;
                    await API.updateRepo(existing.id, patch);
                    toast('Repo updated', 'success');
                } else {
                    const payload = {
                        fullName: fullName,
                        vcsProvider: providerSel.value,
                        enabled: enabledChk.checked
                    };
                    if (tokenInput.value) payload.vcsToken = tokenInput.value;
                    if (secretInput.value) payload.webhookSecret = secretInput.value;
                    if (llmSel.value) payload.llmProviderOverride = llmSel.value;
                    await API.createRepo(payload);
                    toast('Repo registered', 'success');
                }
                onCancel();
                if (onSaved) onSaved();
            } catch (e) {
                showError(e.message || 'Save failed');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = prevText;
            }
        });

        return form;
    }

    document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
